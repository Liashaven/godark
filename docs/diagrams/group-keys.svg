<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 428" width="1280" height="428" role="img" aria-labelledby="t d"><title id="t">How a group's keys change</title><desc id="d">Creating a group makes a random code and the first key. An invite names the group's admins. To join, an admin approves and a new key is sealed to every member. Removing someone makes a new code and key that the removed phone is not given. Every week there is a fresh key; the old one is kept 7 days, then deleted.</desc><style>
.t{font-family:Georgia,'Times New Roman',serif;font-size:34px;fill:#FFFFFF}
.n{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:18px;font-weight:600;fill:#FFFFFF}
.s{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;font-size:13.5px;fill:#A3A3A3}
.e{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;font-size:11.5px;letter-spacing:.16em;fill:#8A8A8A}
.box{fill:#0C0C0C;stroke:#595A5A;stroke-width:1}
.focal{fill:rgba(51,214,74,.07);stroke:#33D64A;stroke-width:1.2}
.a{stroke:#A3A3A3;stroke-width:1.2;fill:none}
.d{stroke:#595A5A;stroke-width:1;fill:none;stroke-dasharray:3 5}
.g{fill:#33D64A}
</style><defs><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#A3A3A3"/></marker><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#33D64A"/></marker></defs><rect x=".5" y=".5" width="1279" height="427" rx="14" fill="#000" stroke="#272727"/><text x="40" y="44" class="e" text-anchor="start">03 · GROUPS</text><text x="40" y="84" class="t" text-anchor="start">How a group's keys change</text><path d="M100 196H1180" stroke="#595A5A" stroke-width="1.2" marker-end="url(#m)"/><circle cx="150" cy="196" r="7" fill="#000" stroke="#FFFFFF" stroke-width="1.6"/><text x="150" y="158" class="e" text-anchor="middle">01</text><text x="150" y="246" class="n" text-anchor="middle">Create</text><text x="150" y="274" class="s" text-anchor="middle">a random code and</text><text x="150" y="294" class="s" text-anchor="middle">the first key;</text><text x="150" y="314" class="s" text-anchor="middle">you are the admin</text><circle cx="390" cy="196" r="7" fill="#000" stroke="#FFFFFF" stroke-width="1.6"/><text x="390" y="158" class="e" text-anchor="middle">02</text><text x="390" y="246" class="n" text-anchor="middle">Invite</text><text x="390" y="274" class="s" text-anchor="middle">a QR code or link</text><text x="390" y="294" class="s" text-anchor="middle">that names the</text><text x="390" y="314" class="s" text-anchor="middle">group's admins</text><circle cx="630" cy="196" r="7" fill="#000" stroke="#FFFFFF" stroke-width="1.6"/><text x="630" y="158" class="e" text-anchor="middle">03</text><text x="630" y="246" class="n" text-anchor="middle">Join</text><text x="630" y="274" class="s" text-anchor="middle">an admin approves;</text><text x="630" y="294" class="s" text-anchor="middle">a new key is sealed</text><text x="630" y="314" class="s" text-anchor="middle">to every member</text><circle cx="870" cy="196" r="7" fill="#000" stroke="#33D64A" stroke-width="1.6"/><circle cx="870" cy="196" r="2.6" class="g"/><text x="870" y="158" class="e" text-anchor="middle">04</text><text x="870" y="246" class="n" text-anchor="middle">Remove</text><text x="870" y="274" class="s" text-anchor="middle">a new code and key;</text><text x="870" y="294" class="s" text-anchor="middle">the removed phone</text><text x="870" y="314" class="s" text-anchor="middle">is not given them</text><circle cx="1110" cy="196" r="7" fill="#000" stroke="#FFFFFF" stroke-width="1.6"/><text x="1110" y="158" class="e" text-anchor="middle">05</text><text x="1110" y="246" class="n" text-anchor="middle">Every week</text><text x="1110" y="274" class="s" text-anchor="middle">a fresh key; the old</text><text x="1110" y="294" class="s" text-anchor="middle">one is kept 7 days,</text><text x="1110" y="314" class="s" text-anchor="middle">then deleted</text><text x="40" y="372" class="s" text-anchor="start">The group code only opens the door. Messages are sealed with a random key that changes,</text><text x="40" y="396" class="s" text-anchor="start">sealed separately to each member, so knowing the code is not enough to read or write.</text></svg>
