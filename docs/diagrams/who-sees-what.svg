<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 436" width="1280" height="436" role="img" aria-labelledby="t d"><title id="t">Who sees what, by design</title><desc id="d">Group members read the message. Phones that carry a packet see its id, time, hops left and size, not the text. Internet relays see a 2-byte mailbox tag, timing and size, and your address only if Tor is switched off, not the text. Someone who has only the group code can ask to join; an admin must let them in. The Everyone channel is public by design.</desc><style>
.t{font-family:Georgia,'Times New Roman',serif;font-size:34px;fill:#FFFFFF}
.n{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:18px;font-weight:600;fill:#FFFFFF}
.s{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;font-size:13.5px;fill:#A3A3A3}
.e{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;font-size:11.5px;letter-spacing:.16em;fill:#8A8A8A}
.box{fill:#0C0C0C;stroke:#595A5A;stroke-width:1}
.focal{fill:rgba(51,214,74,.07);stroke:#33D64A;stroke-width:1.2}
.a{stroke:#A3A3A3;stroke-width:1.2;fill:none}
.d{stroke:#595A5A;stroke-width:1;fill:none;stroke-dasharray:3 5}
.g{fill:#33D64A}
</style><defs><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#A3A3A3"/></marker><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#33D64A"/></marker></defs><rect x=".5" y=".5" width="1279" height="435" rx="14" fill="#000" stroke="#272727"/><text x="40" y="44" class="e" text-anchor="start">02 · PRIVACY BY DESIGN</text><text x="40" y="84" class="t" text-anchor="start">Who sees what</text><rect x="40" y="124" width="285" height="214" rx="8" class="focal"/><text x="58" y="152" class="e" text-anchor="start">GROUP MEMBERS</text><text x="58" y="182" class="n" text-anchor="start">Read the message</text><text x="58" y="208" class="s" text-anchor="start">text, photos, check-ins</text><text x="58" y="228" class="s" text-anchor="start">and who signed it</text><text x="58" y="248" class="s" text-anchor="start"></text><text x="58" y="268" class="s" text-anchor="start">Only phones that hold</text><text x="58" y="288" class="s" text-anchor="start">the group's current key.</text><rect x="345" y="124" width="285" height="214" rx="8" class="box"/><text x="363" y="152" class="e" text-anchor="start">PHONES THAT CARRY IT</text><text x="363" y="182" class="n" text-anchor="start">See a sealed packet</text><text x="363" y="208" class="s" text-anchor="start">its id, time, hops left</text><text x="363" y="228" class="s" text-anchor="start">and size</text><text x="363" y="248" class="s" text-anchor="start"></text><text x="363" y="268" class="s" text-anchor="start">Not the text.</text><rect x="650" y="124" width="285" height="214" rx="8" class="box"/><text x="668" y="152" class="e" text-anchor="start">INTERNET RELAYS</text><text x="668" y="182" class="n" text-anchor="start">See traffic</text><text x="668" y="208" class="s" text-anchor="start">a 2-byte mailbox tag,</text><text x="668" y="228" class="s" text-anchor="start">timing and size;</text><text x="668" y="248" class="s" text-anchor="start">your address only if</text><text x="668" y="268" class="s" text-anchor="start">Tor is switched off</text><text x="668" y="288" class="s" text-anchor="start">Not the text.</text><rect x="955" y="124" width="285" height="214" rx="8" class="box"/><text x="973" y="152" class="e" text-anchor="start">THE GROUP CODE ALONE</text><text x="973" y="182" class="n" text-anchor="start">Can only knock</text><text x="973" y="208" class="s" text-anchor="start">The code opens the door:</text><text x="973" y="228" class="s" text-anchor="start">a request to join.</text><text x="973" y="248" class="s" text-anchor="start">An admin must let</text><text x="973" y="268" class="s" text-anchor="start">you in.</text><text x="973" y="288" class="s" text-anchor="start">Not the text.</text><text x="40" y="380" class="s" text-anchor="start">The Everyone channel is public by design: anyone with the app can read and post there.</text><text x="40" y="404" class="s" text-anchor="start">This is the design. The Status section lists what has been checked on real phones and what has not.</text></svg>
