<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 496" width="1280" height="496" role="img" aria-labelledby="t d"><title id="t">How a message travels</title><desc id="d">You write a message. Your phone encrypts and signs it with the group's current key and wraps it in a sealed packet. The packet leaves over any link that is up: Bluetooth LE, a Wi-Fi network, a LoRa radio or internet relays through Tor. Other phones carry it on without being able to read it, for up to 16 hops and 7 days. Group members open it, check the signature and show the message.</desc><style>
.t{font-family:Georgia,'Times New Roman',serif;font-size:34px;fill:#FFFFFF}
.n{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:18px;font-weight:600;fill:#FFFFFF}
.s{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;font-size:13.5px;fill:#A3A3A3}
.e{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;font-size:11.5px;letter-spacing:.16em;fill:#8A8A8A}
.box{fill:#0C0C0C;stroke:#595A5A;stroke-width:1}
.focal{fill:rgba(51,214,74,.07);stroke:#33D64A;stroke-width:1.2}
.a{stroke:#A3A3A3;stroke-width:1.2;fill:none}
.d{stroke:#595A5A;stroke-width:1;fill:none;stroke-dasharray:3 5}
.g{fill:#33D64A}
</style><defs><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#A3A3A3"/></marker><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#33D64A"/></marker></defs><rect x=".5" y=".5" width="1279" height="495" rx="14" fill="#000" stroke="#272727"/><text x="40" y="44" class="e" text-anchor="start">01 · DELIVERY</text><text x="40" y="84" class="t" text-anchor="start">How a message travels</text><rect x="40" y="128" width="180" height="130" rx="8" class="box"/><text x="58" y="156" class="e" text-anchor="start">YOUR PHONE</text><text x="58" y="186" class="n" text-anchor="start">You write</text><text x="58" y="212" class="s" text-anchor="start">a message, photo,</text><text x="58" y="232" class="s" text-anchor="start">check-in or place</text><path d="M220 193L256 193" class="a" marker-end="url(#m)"/><rect x="260" y="128" width="214" height="130" rx="8" class="focal"/><text x="278" y="156" class="e" text-anchor="start">SEALED</text><text x="278" y="186" class="n" text-anchor="start">Encrypted, signed</text><text x="278" y="212" class="s" text-anchor="start">with the group's</text><text x="278" y="232" class="s" text-anchor="start">current key</text><path d="M474 193L510 193" class="a" marker-end="url(#m)"/><rect x="514" y="128" width="206" height="130" rx="8" class="box"/><text x="532" y="156" class="e" text-anchor="start">PACKET</text><text x="532" y="186" class="n" text-anchor="start">Sealed packet</text><text x="532" y="212" class="s" text-anchor="start">id · time · hops left</text><text x="532" y="232" class="s" text-anchor="start">length is padded</text><rect x="770" y="104" width="216" height="36" rx="6" class="box"/><text x="788" y="127.5" class="n" text-anchor="start" style="font-size:15.5px">Bluetooth LE</text><path d="M720 193L766 122" class="a" marker-end="url(#m)"/><path d="M986 122L1012 193" class="a"/><rect x="770" y="150" width="216" height="36" rx="6" class="box"/><text x="788" y="173.5" class="n" text-anchor="start" style="font-size:15.5px">Wi-Fi network</text><path d="M720 193L766 168" class="a" marker-end="url(#m)"/><path d="M986 168L1012 193" class="a"/><rect x="770" y="196" width="216" height="36" rx="6" class="box"/><text x="788" y="219.5" class="n" text-anchor="start" style="font-size:15.5px">LoRa radio</text><path d="M720 193L766 214" class="a" marker-end="url(#m)"/><path d="M986 214L1012 193" class="a"/><rect x="770" y="242" width="216" height="36" rx="6" class="box"/><text x="788" y="265.5" class="n" text-anchor="start" style="font-size:15.5px">Internet relays · Tor</text><path d="M720 193L766 260" class="a" marker-end="url(#m)"/><path d="M986 260L1012 193" class="a"/><text x="770" y="92" class="e" text-anchor="start">ANY LINK THAT IS UP</text><path d="M1012 193L1036 193" class="a" marker-end="url(#m)"/><rect x="1040" y="128" width="200" height="130" rx="8" class="box"/><text x="1058" y="156" class="e" text-anchor="start">OTHER PHONES</text><text x="1058" y="186" class="n" text-anchor="start">Carry it on</text><text x="1058" y="212" class="s" text-anchor="start">can't read it</text><text x="1058" y="232" class="s" text-anchor="start">16 hops · 7 days</text><path d="M1140 258L1140 322" class="a" marker-end="url(#mg)" style="stroke:#33D64A"/><rect x="1040" y="326" width="200" height="130" rx="8" class="focal"/><text x="1058" y="354" class="e" text-anchor="start">GROUP MEMBERS</text><text x="1058" y="384" class="n" text-anchor="start">Open it</text><text x="1058" y="410" class="s" text-anchor="start">check the signature,</text><text x="1058" y="430" class="s" text-anchor="start">show the message</text><path d="M40 326h960v130h-960z" fill="none" stroke="#272727"/><text x="62" y="362" class="s" text-anchor="start">No account and no server of ours.</text><text x="62" y="392" class="s" text-anchor="start">A phone that only carries a packet never holds the key to it.</text><text x="62" y="422" class="s" text-anchor="start">Without internet, packets hop from phone to phone. With internet, they also cross</text><text x="62" y="442" class="s" text-anchor="start">free public relays, through Tor unless you turn it off.</text></svg>
