name: Account service CI

on:
  push:
    branches: [main]
    paths:
      - 'account-service/**'
      - '.github/workflows/account-service.yml'
  pull_request:
    branches: [main]
    paths:
      - 'account-service/**'
      - '.github/workflows/account-service.yml'

permissions:
  contents: read

jobs:
  test:
    name: Test account-service source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run source tests
        working-directory: account-service
        run: node --test
